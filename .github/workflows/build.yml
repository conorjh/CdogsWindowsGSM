name: Build
on: [push, pull_request]

jobs:
  Build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore
      run: dotnet restore CdogsWindowsGSM.sln
    - name: Build solution and publish single-file executables
      shell: pwsh
      run: |
        dotnet build CdogsWindowsGSM.sln --configuration Release --no-restore
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Verify single-file outputs
      shell: pwsh
      run: |
        $expectedFiles = @(
          @{ Directory = '.\artifacts\app'; Name = 'CdogsWindowsGSM.exe' },
          @{ Directory = '.\artifacts\updater'; Name = 'CdogsWindowsGSM-Updater.exe' }
        )
        foreach ($expected in $expectedFiles) {
          $files = @(Get-ChildItem -LiteralPath $expected.Directory -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne $expected.Name) {
            $actualFiles = ($files | Select-Object -ExpandProperty Name) -join ', '
            throw "Expected only $($expected.Name) in $($expected.Directory); found: $actualFiles"
          }
        }
    - name: Upload release assets
      uses: actions/upload-artifact@v4
      with:
        name: CdogsWindowsGSM-win-x64
        path: |
          artifacts\app\CdogsWindowsGSM.exe
          artifacts\updater\CdogsWindowsGSM-Updater.exe
        if-no-files-found: error
